[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scDblFinderPy"
version = "0.1.0"
description = "Python implementation of the scDblFinder doublet-detection workflow for AnnData/Scanpy."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.4.3",
    "pandas==2.3.3",
    "scipy==1.16.3",
    "anndata==0.12.13",
    "scanpy==1.12.1",
    "scikit-learn==1.8.0",
    "xgboost==3.2.0",
    "statsmodels==0.14.6",
    "leidenalg==0.11.0",
    "igraph==1.0.0",
]

# GPU acceleration (use_gpu=True) additionally requires rapids-singlecell,
# cuml, cudf and cugraph, which are compiled CUDA extensions that NVIDIA
# distributes through conda/mamba rather than PyPI wheels — there is no pip
# extra for this. See the README's GPU setup section for the conda recipe.

[project.scripts]
scDblFinderPy = "scDblFinderPy.scDblFinder:main"

[tool.setuptools.packages.find]
where = ["src"]
